<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FitCRM - Edit Client Details</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <a href="clients.html" class="nav-link">← Back to Client List</a>

  <h2>Edit Client Details</h2>

  <form>
    <label>Full Name:
      <input type="text" name="fullname" value="John Doe" />
    </label>

    <label>Age:
      <input type="number" name="age" value="28" />
    </label>

    <label>Gender:
      <select name="gender">
        <option value="male" selected>Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>
    </label>

    <label>Email:
      <input type="email" name="email" value="john@example.com" />
    </label>

    <label>Phone:
      <input type="tel" name="phone" value="555-1234" />
    </label>

    <label>Fitness Goal:
      <select name="goal">
        <option value="weightloss" selected>Weight Loss</option>
        <option value="musclegain">Muscle Gain</option>
        <option value="generalfitness">General Fitness</option>
        <option value="other">Other</option>
      </select>
    </label>

    <label>Membership Start Date:
      <input type="date" name="startdate" value="2024-01-15" />
    </label>

    <button type="submit">Save Changes</button>
  </form>
</body>
</html>
