<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitCRM - Client View</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <h1>FitCRM</h1>
    <nav><a href="clients.html">Back to Client List</a></nav>
  </header>

  <main class="container">
    <section class="card view-card">
      <h2 id="clientName">Client Name</h2>
      <div class="client-details">
        <p><strong>Email:</strong> <span id="clientEmail"></span></p>
        <p><strong>Phone:</strong> <span id="clientPhone"></span></p>
        <p><strong>Goal:</strong> <span id="clientGoal"></span></p>
        <p><strong>Start Date:</strong> <span id="clientStart"></span></p>
      </div>
      <hr>
      <div>
        <h3>Training History</h3>
        <ul id="trainingHistory"></ul>
      </div>
      <hr>
      <div>
        <h3>Suggested Exercises</h3>
        <div id="exerciseList">Loading exercises…</div>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
