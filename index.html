<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FitCRM - Add New Client</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <h2>Add New Client</h2>

  <div class="form-container">
    <form id="clientForm">
      <label>Full Name
        <input type="text" id="name" placeholder="Enter full name" required>
      </label>

      <label>Age
        <input type="number" id="age" placeholder="Enter age" required>
      </label>

      <label>Gender
        <select id="gender" required>
          <option value="">Select Gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </label>

      <label>Email
        <input type="email" id="email" placeholder="Enter email" required>
      </label>

      <label>Phone
        <input type="tel" id="phone" placeholder="Enter phone number" required>
      </label>

      <label>Fitness Goal
        <select id="goal" required>
          <option value="">Select Goal</option>
          <option>Weight Loss</option>
          <option>Muscle Gain</option>
          <option>General Fitness</option>
          <option>Other</option>
        </select>
      </label>

      <label>Membership Start Date
        <input type="date" id="startDate" required>
      </label>

      <button type="submit" class="add-btn">Add Client</button>
    </form>

    <a href="clients.html" class="nav-link">View Client List</a>
  </div>

  <script>
    const clientForm = document.getElementById('clientForm');

    const sampleClients = [
      { id: 1, name: "Farida Abdelrazek", email: "Faridaabdelrazek@gmail.com", phone: "555-1234", goal: "Weight Loss", startDate: "2024-01-15", age: 28, gender: "Female" },
      { id: 2, name: "Tarek Mohamed", email: "Tarekkmohamed@gmail.com", phone: "555-5678", goal: "Muscle Gain", startDate: "2024-03-12", age: 32, gender: "Male" },
      { id: 3, name: "Lana Ahmed", email: "lanabeshir@gmail.com", phone: "555-8765", goal: "General Fitness", startDate: "2023-11-10", age: 25, gender: "Female" },
      { id: 4, name: "Mohamed Beshir", email: "Mohamedbeshir@gmail.com", phone: "555-4321", goal: "Weight Loss", startDate: "2024-06-01", age: 30, gender: "Male" },
      { id: 5, name: "Yassin el Massry", email: "Yassin@gmail.com", phone: "555-6789", goal: "Muscle Gain", startDate: "2025-02-20", age: 27, gender: "Male" },
      { id: 6, name: "Mirna Sameh", email: "Mirnasameh@gmail.com", phone: "555-3456", goal: "General Fitness", startDate: "2024-09-15", age: 29, gender: "Female" },
      { id: 7, name: "Malak Solima", email: "Malaksoliman@gmail.com", phone: "555-7890", goal: "Weight Loss", startDate: "2024-12-05", age: 26, gender: "Female" },
      { id: 8, name: "Ahmed Hany", email: "Ahmedhany@gmail.com", phone: "555-9012", goal: "Muscle Gain", startDate: "2023-08-25", age: 31, gender: "Male" },
      { id: 9, name: "Ismail Mostafa", email: "Ismailmostafa@gmail.com", phone: "555-2345", goal: "General Fitness", startDate: "2024-04-18", age: 28, gender: "Male" },
      { id: 10, name: "Gamal Hussein", email: "Gamalhussein@gmail.com", phone: "555-6781", goal: "Weight Loss", startDate: "2025-01-05", age: 33, gender: "Male" }
    ];

    // Load clients from localStorage or use sample clients
    let clients = JSON.parse(localStorage.getItem('clients'));
    if (!clients || clients.length === 0) {
      clients = [...sampleClients];
      localStorage.setItem('clients', JSON.stringify(clients));
    }

    function saveClients() {
      localStorage.setItem('clients', JSON.stringify(clients));
    }

    clientForm.addEventListener('submit', e => {
      e.preventDefault();

      const newClient = {
        id: Date.now(),
        name: document.getElementById('name').value,
        age: document.getElementById('age').value,
        gender: document.getElementById('gender').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        goal: document.getElementById('goal').value,
        startDate: document.getElementById('startDate').value
      };

      clients.push(newClient);
      saveClients();

      alert('Client added!');
      clientForm.reset();
    });
  </script>
</body>
</html>
