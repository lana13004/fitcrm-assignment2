<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FitCRM — Add New Client</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>FitCRM</h1>
    <nav><a href="clients.html">Client List</a></nav>
  </header>

  <main class="container">
    <section class="card form-card">
      <h2>New Client Form</h2>

      <!-- Add client form -->
      <form id="clientForm" novalidate>
        <div class="form-row">
          <label for="fullname">Full Name <span class="req">*</span></label>
          <input id="fullname" name="fullname" type="text" placeholder="Enter full name" required />
        </div>

        <div class="form-row">
          <label for="age">Age</label>
          <input id="age" name="age" type="number" min="0" placeholder="Enter age" />
        </div>

        <div class="form-row">
          <label for="gender">Gender</label>
          <select id="gender" name="gender">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-row">
          <label for="email">Email <span class="req">*</span></label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required />
        </div>

        <div class="form-row">
          <label for="phone">Phone</label>
          <input id="phone" name="phone" type="tel" placeholder="Enter phone number" />
        </div>

        <div class="form-row">
          <label for="goal">Fitness Goal</label>
          <select id="goal" name="goal">
            <option value="">Select Goal</option>
            <option value="Weight Loss">Weight Loss</option>
            <option value="Muscle Gain">Muscle Gain</option>
            <option value="General Fitness">General Fitness</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-row">
          <label for="startdate">Membership Start Date</label>
          <input id="startdate" name="startdate" type="date" />
        </div>

        <div class="form-actions">
          <!-- placeholder button: actually saves to localStorage via JS -->
          <button id="addClientBtn" type="submit" class="btn btn-primary">Add Client</button>
          <a class="btn btn-secondary" href="clients.html">View Client List</a>
        </div>

        <div id="formMessage" class="form-message" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
