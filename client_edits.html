<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FitCRM - View Client</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <a href="clients.html" class="nav-link">← Back to Client List</a>

  <h2>Client Details</h2>

  <div class="form-container">
    <p><strong>Name:</strong> <span id="clientName"></span></p>
    <p><strong>Email:</strong> <span id="clientEmail"></span></p>
    <p><strong>Phone:</strong> <span id="clientPhone"></span></p>
    <p><strong>Fitness Goal:</strong> <span id="clientGoal"></span></p>
    <p><strong>Membership Start Date:</strong> <span id="clientStart"></span></p>

    <h3>Suggested Exercises for Next Session</h3>
    <ul id="exerciseList">
      <!-- JS will populate exercises here -->
    </ul>
  </div>

  <script>
    // Get clients from localStorage
    const clients = JSON.parse(localStorage.getItem('clients')) || [];
    const clientId = localStorage.getItem('viewClientId');
    if (clientId) {
      const client = clients.find(c => c.id == clientId);
      if (client) {
        document.getElementById('clientName').textContent = client.name;
        document.getElementById('clientEmail').textContent = client.email;
        document.getElementById('clientPhone').textContent = client.phone;
        document.getElementById('clientGoal').textContent = client.goal;
        document.getElementById('clientStart').textContent = client.startDate;
      }
    }

    // Suggested exercises placeholder
    const exercises = ['Push Ups', 'Squats', 'Lunges', 'Plank', 'Burpees'];
    const exerciseList = document.getElementById('exerciseList');
    exercises.forEach(ex => {
      const li = document.createElement('li');
      li.textContent = ex;
      exerciseList.appendChild(li);
    });
  </script>
</body>
</html>
