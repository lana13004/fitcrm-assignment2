<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FitCRM - Edit Client</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <a href="clients.html" class="nav-link">← Back to Client List</a>

  <h2>Edit Client Details</h2>

  <div class="form-container">
    <form id="editClientForm">
      <label>Full Name
        <input type="text" id="name" required>
      </label>

      <label>Age
        <input type="number" id="age" required>
      </label>

      <label>Gender
        <select id="gender" required>
          <option value="">Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </label>

      <label>Email
        <input type="email" id="email" required>
      </label>

      <label>Phone
        <input type="tel" id="phone" required>
      </label>

      <label>Fitness Goal
        <select id="goal" required>
          <option value="">Select Goal</option>
          <option value="Weight Loss">Weight Loss</option>
          <option value="Muscle Gain">Muscle Gain</option>
          <option value="General Fitness">General Fitness</option>
          <option value="Other">Other</option>
        </select>
      </label>

      <label>Membership Start Date
        <input type="date" id="startDate" required>
      </label>

      <button type="submit">Save Changes</button>
    </form>
  </div>

  <script>
    const clients = JSON.parse(localStorage.getItem('clients')) || [];
    const clientId = localStorage.getItem('viewClientId');
    const form = document.getElementById('editClientForm');

    // Populate form with existing data
    if (clientId) {
      const client = clients.find(c => c.id == clientId);
      if (client) {
        document.getElementById('name').value = client.name;
        document.getElementById('age').value = client.age;
        document.getElementById('gender').value = client.gender;
        document.getElementById('email').value = client.email;
        document.getElementById('phone').value = client.phone;
        document.getElementById('goal').value = client.goal;
        document.getElementById('startDate').value = client.startDate;
      }
    }

    // Save changes
    form.addEventListener('submit', e => {
      e.preventDefault();
      const index = clients.findIndex(c => c.id == clientId);
      if (index > -1) {
        clients[index] = {
          ...clients[index],
          name: document.getElementById('name').value,
          age: document.getElementById('age').value,
          gender: document.getElementById('gender').value,
          email: document.getElementById('email').value,
          phone: document.getElementById('phone').value,
          goal: document.getElementById('goal').value,
          startDate: document.getElementById('startDate').value
        };
        localStorage.setItem('clients', JSON.stringify(clients));
        alert('Client updated successfully!');
        window.location.href = 'clients.html';
      }
    });
  </script>
</body>
</html>
