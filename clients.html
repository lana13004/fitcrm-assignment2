<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FitCRM — Client List</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>FitCRM</h1>
    <nav><a href="index.html">Add New Client</a></nav>
  </header>

  <main class="container">
    <section class="card list-card">
      <h2>Client List</h2>

      <div class="search-row">
        <input id="searchInput" type="text" placeholder="Search by name..." />
        <button id="clearSearch" class="btn btn-secondary">Clear</button>
      </div>

      <div class="table-wrap">
        <table id="clientsTable">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Fitness Goal</th>
              <th>Start Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- populated by JS -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
